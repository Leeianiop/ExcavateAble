version: "1.0"

capture:
  width: 4056
  height: 3040
  framerate: 30
  iso: 100
  shutter_speed: 0
  awb_mode: "auto"
  exposure_mode: "auto"
  num_shots: 20
  shot_interval_sec: 1.5
  save_raw: true
  save_jpeg: true
  jpeg_quality: 95
  # Low-power resolution used only by `live-stream` (preview). The still
  # capture above keeps the full 4056x3040 for photogrammetry.
  live_stream_width: 1280
  live_stream_height: 720
  live_stream_save_raw: false
  # Seconds between pushed preview frames: 0.05 = 20 fps. Independent of
  # shot_interval_sec so live preview and stills pacing don't fight.
  live_stream_interval_sec: 0.05

hailo:
  segmentation_model_path: "./models/yolov8n_seg.hef"
  depth_model_path: "./models/dpt_lite.hef"
  input_width: 640
  input_height: 640
  depth_input_width: 320
  depth_input_height: 256
  threshold: 0.7
  nms_threshold: 0.35
  device_id: 0

upload:
  # Must be the HOST machine's LAN IP, not localhost: on the Pi "localhost"
  # is the Pi itself, so every upload dies with Errno 111 (connection refused).
  # 192.168.137.1 = Windows Mobile Hotspot. Use 192.168.0.2 if the Pi is on
  # the home router instead (and disable AP isolation).
  backend_url: "http://192.168.137.1:8000"
  api_key: ""
  upload_timeout_sec: 120
  max_retries: 3
  retry_delay_sec: 5

storage:
  local_dir: "./captures"
  keep_local_after_upload: true
  max_local_gb: 10

logging:
  level: "INFO"
  file: "./logs/edge_node.log"
  max_bytes: 10485760
  backup_count: 5
