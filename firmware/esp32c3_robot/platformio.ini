[platformio]
src_dir = .
default_envs = esp32c3_supermini
; This project lives under OneDrive, which locks .pio/* mid-build and makes
; the link step fail with "No such file or directory" / "being used by
; another process". Keep build output outside the synced folder.
build_dir = ${sysenv.USERPROFILE}/.platformio/build/esp32c3_robot

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
